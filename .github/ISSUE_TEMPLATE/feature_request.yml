name: Feature request
description: Something the tool should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the workflow, not the implementation.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: Manual steps, another tool, or not at all.
  - type: textarea
    id: shape
    attributes:
      label: What the command might look like
      render: shell
      placeholder: substack export --format json
  - type: checkboxes
    id: checks
    attributes:
      options:
        - label: I checked the docs and the existing issues.
          required: true
